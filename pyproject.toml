[project]
name = "xxthunder-agentic-skills"
version = "0.0.0"
requires-python = ">=3.11"
description = "Dev harness for the xxthunder-agentic-skills marketplace. Plugins install via `claude plugin install`; this pyproject exists only so `uv run --group dev pytest` can execute the plugin-script test suite."

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pypdf>=4",
    "reportlab>=4",
    "pyyaml>=6",
    "tomlkit>=0.13",
    "sphinx>=9.0.4",
    "myst-parser>=5.1.0",
    "sphinx-needs>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["plugins", "evals"]
patch = ["subprocess"]  # scripts the tests run as subprocesses count too
