name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flag: ubuntu
          - os: windows-latest
            flag: windows
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run pytest
        id: pytest
        continue-on-error: true
        run: uv run --group dev pytest -q --cov --cov-report=xml --junit-xml=junit.xml

      - name: Install ubc
        if: matrix.os == 'ubuntu-latest'
        uses: useblocks/ubc-action@0422e463faa37e16f39d3d6eb21b15f9e3e060f9 # 0.1
        with:
          version: 0.39.0

      # ubc says "No errors found" also when it sees no file, and exits 0 on warnings:
      # count the ADRs it sees, and deny warnings.
      - name: Check the migrated ADR fixture with ubc
        if: matrix.os == 'ubuntu-latest'
        working-directory: tests/dev/adr/fixtures/needs-repo-migrated
        run: |
          ubc build list-documents
          seen=$(ubc build list-documents | grep -c '^docs/adr/0') || true
          [ "$seen" -eq 2 ] || { echo "::error::ubc sees $seen of the 2 ADRs"; exit 1; }
          ubc check --deny warning

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: ${{ matrix.flag }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: junit.xml
          flags: ${{ matrix.flag }}
          report_type: test_results
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Publish JUnit test results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: junit.xml
          check_name: Test Results (uv pytest, ${{ matrix.flag }})
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true
          detailed_summary: true
          include_passed: false
